<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kripto Grafik Analiz Portalı</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #10b981;
            --border-color: #334155;
            --error-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background-color: #0f172a;
        }
        .upload-box img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            margin-top: 10px;
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #resultArea {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .error-msg {
            color: var(--error-color);
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--error-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📷 Grafik Yükleme & Analiz (OpenRouter Free)</h2>
        
        <input type="text" id="apiKey" placeholder="OpenRouter API Key Yapıştırın (sk-or-...)" oninput="saveKey()">
        
        <div class="upload-box" onclick="document.getElementById('imageInput').click()">
            <div>📊 Grafik Görselini Seçmek İçin Dokunun</div>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="previewImage(event)">
            <img id="preview" style="display:none;">
        </div>

        <button id="analyzeBtn" onclick="analyzeChart()">Grafiği Analiz Et</button>
    </div>

    <div class="card">
        <h2>🎯 Analiz Raporu & Sinyal</h2>
        <div id="resultArea">Henüz bir grafik analiz edilmedi. Ekran görüntüsü yükleyip "Grafiği Analiz Et" butonuna basınız.</div>
    </div>
</div>

<script>
    let base64Image = "";
    let mimeType = "image/jpeg";

    window.onload = function() {
        const savedKey = localStorage.getItem("openrouter_key");
        if(savedKey) document.getElementById("apiKey").value = savedKey;
    }

    function saveKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("openrouter_key", key);
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        mimeType = file.type || "image/jpeg";
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'block';
            // DÜZELTİLEN SATIR: Görsel verisini doğru şekilde parçalayıp sadece Base64 kısmını alıyoruz
            base64Image = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
    }

    async function analyzeChart() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const resultDiv = document.getElementById("resultArea");
        const btn = document.getElementById("analyzeBtn");

        if (!apiKey) {
            alert("Lütfen OpenRouter API Anahtarınızı girin!");
            return;
        }
        if (!base64Image) {
            alert("Lütfen bir grafik görseli seçin!");
            return;
        }

        resultDiv.innerHTML = "⏳ Yapay zeka grafiği analiz ediyor...";
        btn.disabled = true;

        const systemPrompt = `Sen profesyonel bir Kripto Teknik Analiz Uzmanısın. Yüklenen grafiği detaylı incele ve Türkçe olarak şu başlıklarla analiz et:
1. Trend ve Dow Teorisi: (Mevcut trend yönü, Yüksek Yüksekler/Düşük Düşükler yapısı)
2. Kritik Seviyeler: (Grafikteki en belirgin Destek ve Direnç bölgeleri)
3. Formasyon ve Mum Analizi: (Varsa ikili dip/tepe, flama, obo veya belirgin mum formasyonları)
4. Strateji ve 1:2 Risk/Ödül: (Giriş seviyesi, Stop-Loss ve en az 1:2 Oranlı Take-Profit hedefi)
5. Sonuç / İşlem Sinyali: (AL / SAT / BEKLE kararı ve kısa gerekçe)`;

        const payload = {
            model: "google/gemini-2.5-flash:free",
            messages: [
                {
                    role: "system",
                    content: systemPrompt
                },
                {
                    role: "user",
                    content: [
                        {
                            type: "text",
                            text: "Lütfen ekteki kripto para grafiğini teknik analiz kurallarına göre detaylıca incele."
                        },
                        {
                            type: "image_url",
                            image_url: {
                                url: `data:${mimeType};base64,${base64Image}`
                            }
                        }
                    ]
                }
            ]
        };

        try {
            const url = "https://openrouter.ai";
            
            const response = await fetch(url, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`,
                    "HTTP-Referer": window.location.origin
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "OpenRouter API Hatası oluştu.");
            }

            const textResult = data.choices[0].message.content;
            resultDiv.innerText = textResult;

        } catch (error) {
            resultDiv.innerHTML = `<div class="error-msg"><strong>❌ Hata Oluştu:</strong><br>${error.message}</div>`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
